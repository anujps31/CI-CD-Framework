parameters:
  - name: enableSonarQube
    type: boolean
    default: true

steps:
  - bash: |
      set -euo pipefail
      # Infrastructure checks (fmt, tflint, Checkov) run in pipelines/infra-pipeline.yml.
      # Developer team owns application test cases under tests/.
      if [ -d tests ] && find tests -type f \( -name 'test_*.py' -o -name '*_test.py' \) | grep -q .; then
        python3 -m pip install -r microservices/orders-api/requirements.txt coverage
        coverage run -m unittest discover -s tests -v
        coverage xml -o coverage.xml
      else
        echo 'No developer-owned tests found; SonarQube will report no application coverage for this project.'
      fi
    displayName: Prepare developer test coverage

  # Excluded from the run entirely when off, so the pipeline works before the
  # SonarQube extension is installed in the organization.
  - ${{ if eq(parameters.enableSonarQube, true) }}:
      - task: SonarQubePrepare@7
        displayName: Prepare SonarQube analysis
        inputs:
          # This name must match the Azure DevOps SonarQube service connection.
          SonarQube: sonarqube-service-connection
          scannerMode: cli
          configMode: file

      - task: SonarQubeAnalyze@7
        displayName: SonarQube code quality and coverage

      - task: SonarQubePublish@7
        displayName: Publish SonarQube quality gate
        inputs:
          pollingTimeoutSec: '300'

  - bash: |
      set -euo pipefail
      trivy fs --exit-code 1 --severity HIGH,CRITICAL --skip-dirs .git "$(Build.SourcesDirectory)"
    displayName: Open-source filesystem security scan

  - bash: ./scripts/cleanup-agent-workspace.sh
    condition: always()
    displayName: Clean self-hosted agent workspace