parameters:
  - name: environmentName
    type: string
    # This framework is Dev-only: always "dev", matching infra/environments/dev.
  - name: serviceConnection
    type: string
    # Azure DevOps service connection authorized for this environment.
  - name: variableGroup
    type: string
    # Variable group containing the environment IDs, names, and secrets.
  - name: projectName
    type: string
  - name: deploymentProfile
    type: string
    # Selects which workloads are deployed below.
  - name: dependsOn
    type: string
    default: Build
  - name: branchCondition
    type: string
    # Prevents a pipeline run from deploying to the wrong environment.
    default: "true"

stages:
  # This reusable template deploys one environment using its own service connection and variables.
  - stage: Deploy_${{ parameters.environmentName }}
    displayName: Deploy ${{ parameters.environmentName }}
    dependsOn: ${{ parameters.dependsOn }}
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), ${{ parameters.branchCondition }})
    variables:
      - group: ${{ parameters.variableGroup }}
      - name: environmentName
        value: ${{ parameters.environmentName }}
    jobs:
      - deployment: Deploy
        environment: ${{ parameters.environmentName }}
        pool:
          name: $(selfHostedPool)
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - download: current
                  artifact: build-artifact
                - bash: |
                    set -euo pipefail
                    ./scripts/validate-config.sh "${{ parameters.environmentName }}" "${{ parameters.deploymentProfile }}"
                  displayName: Validate deployment prerequisites
                  env:
                    ARM_SUBSCRIPTION_ID: $(ARM-SUBSCRIPTION-ID)
                    ARM_TENANT_ID: $(ARM-TENANT-ID)
                    ARM_CLIENT_ID: $(ARM-CLIENT-ID)
                    RESOURCE_GROUP_NAME: $(RESOURCE-GROUP-NAME)
                    DATABRICKS_HOST: $(DATABRICKS-HOST)
                    DATABRICKS_ACCOUNT_ID: $(DATABRICKS-ACCOUNT-ID)
                    DATABRICKS_CLIENT_ID: $(DATABRICKS-CLIENT-ID)
                    DATABRICKS_CLIENT_SECRET: $(DATABRICKS-CLIENT-SECRET)
                    ACR_NAME: $(ACR-NAME)
                    AKS_NAME: $(AKS-NAME)
                    # Client IP ranges allowed to open the public hello-web page, e.g. 1.2.3.4/32,5.6.7.8/32.
                    ALLOWED_CIDRS: $(HELLO-ALLOWED-CIDRS)
                # Infrastructure is applied by pipelines/infra-pipeline.yml, never by this pipeline.
                # DATABRICKS-HOST and resource names come from the variable groups.
                # ADF and Databricks steps run inside AzureCLI@2 so they are signed in as the
                # service connection. Databricks uses that same Azure CLI login (azure-cli auth);
                # the identity has Contributor on the workspace, which makes it a workspace admin.
                - ${{ if or(eq(parameters.deploymentProfile, 'FULL_PLATFORM'), eq(parameters.deploymentProfile, 'ADF_DATABRICKS'), eq(parameters.deploymentProfile, 'ADF_ONLY')) }}:
                  - task: AzureCLI@2
                    displayName: Deploy ADF ARM artifact
                    inputs:
                      azureSubscription: ${{ parameters.serviceConnection }}
                      scriptType: bash
                      scriptLocation: inlineScript
                      workingDirectory: $(Build.SourcesDirectory)
                      inlineScript: |
                        set -euo pipefail
                        ./scripts/deploy-adf.sh "${{ parameters.environmentName }}" "$(RESOURCE-GROUP-NAME)" "$(Pipeline.Workspace)/build-artifact/adf"
                - ${{ if eq(parameters.deploymentProfile, 'DATABRICKS_DABS') }}:
                  - task: AzureCLI@2
                    displayName: Deploy Databricks Asset Bundle
                    inputs:
                      azureSubscription: ${{ parameters.serviceConnection }}
                      scriptType: bash
                      scriptLocation: inlineScript
                      workingDirectory: $(Pipeline.Workspace)/build-artifact/dabs
                      inlineScript: |
                        set -euo pipefail
                        export DATABRICKS_HOST="$(DATABRICKS-HOST)"
                        export DATABRICKS_AUTH_TYPE=azure-cli
                        export DATABRICKS_BUNDLE_VAR_workspace_host="$(DATABRICKS-HOST)"
                        databricks bundle validate -t "${{ parameters.environmentName }}"
                        databricks bundle deploy -t "${{ parameters.environmentName }}"
                - ${{ if or(eq(parameters.deploymentProfile, 'FULL_PLATFORM'), eq(parameters.deploymentProfile, 'ADF_DATABRICKS')) }}:
                  - task: AzureCLI@2
                    displayName: Deploy Databricks notebooks and jobs
                    inputs:
                      azureSubscription: ${{ parameters.serviceConnection }}
                      scriptType: bash
                      scriptLocation: inlineScript
                      workingDirectory: $(Build.SourcesDirectory)
                      inlineScript: |
                        set -euo pipefail
                        export DATABRICKS_HOST="$(DATABRICKS-HOST)"
                        export DATABRICKS_AUTH_TYPE=azure-cli
                        ./scripts/deploy-databricks.sh "${{ parameters.environmentName }}" "$(Pipeline.Workspace)/build-artifact"
                - ${{ if or(eq(parameters.deploymentProfile, 'FULL_PLATFORM'), eq(parameters.deploymentProfile, 'MICROSERVICES_ONLY')) }}:
                  - task: AzureCLI@2
                    displayName: Build and deploy microservice to AKS
                    inputs:
                      azureSubscription: ${{ parameters.serviceConnection }}
                      scriptType: bash
                      scriptLocation: inlineScript
                      workingDirectory: $(Build.SourcesDirectory)
                      inlineScript: |
                        set -euo pipefail
                        ./scripts/deploy-microservice.sh "${{ parameters.environmentName }}" "$(RESOURCE-GROUP-NAME)" "$(ACR-NAME)" "$(AKS-NAME)" "$(Pipeline.Workspace)/build-artifact" hello-web
                - task: AzureCLI@2
                  displayName: Post-deployment validation
                  inputs:
                    azureSubscription: ${{ parameters.serviceConnection }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      az resource list --resource-group "$(RESOURCE-GROUP-NAME)" --output table
                - bash: ./scripts/cleanup-agent-workspace.sh
                  condition: always()
                  displayName: Clean self-hosted agent workspace