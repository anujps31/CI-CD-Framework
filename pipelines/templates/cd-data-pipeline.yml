parameters:
  - name: environmentName
    type: string
    # This framework is Dev-only: always "dev", matching infra/environments/dev.
  - name: serviceConnection
    type: string
    # Azure DevOps service connection authorized for this environment.
  - name: variableGroup
    type: string
    # Variable group containing the environment IDs, names, and secrets.
  - name: projectName
    type: string
  - name: deploymentProfile
    type: string
    # Controls Terraform flags and component deployment steps below.
  - name: dependsOn
    type: string
    default: Build
  - name: branchCondition
    type: string
    # Prevents a pipeline run from deploying to the wrong environment.
    default: "true"

stages:
  # This reusable template deploys one environment using its own service connection and variables.
  - stage: Deploy_${{ parameters.environmentName }}
    displayName: Deploy ${{ parameters.environmentName }}
    dependsOn: ${{ parameters.dependsOn }}
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), ${{ parameters.branchCondition }})
    variables:
      - group: ${{ parameters.variableGroup }}
      - name: environmentName
        value: ${{ parameters.environmentName }}
    jobs:
      - deployment: Deploy
        environment: ${{ parameters.environmentName }}
        pool:
          name: $(selfHostedPool)
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - download: current
                  artifact: build-artifact
                - bash: |
                    set -euo pipefail
                    ./scripts/validate-config.sh "${{ parameters.environmentName }}" "${{ parameters.deploymentProfile }}"
                  displayName: Validate deployment prerequisites
                  env:
                    ARM_SUBSCRIPTION_ID: $(ARM-SUBSCRIPTION-ID)
                    ARM_TENANT_ID: $(ARM-TENANT-ID)
                    ARM_CLIENT_ID: $(ARM-CLIENT-ID)
                    RESOURCE_GROUP_NAME: $(RESOURCE-GROUP-NAME)
                    DATABRICKS_HOST: $(DATABRICKS-HOST)
                    DATABRICKS_ACCOUNT_ID: $(DATABRICKS-ACCOUNT-ID)
                    DATABRICKS_CLIENT_ID: $(DATABRICKS-CLIENT-ID)
                    DATABRICKS_CLIENT_SECRET: $(DATABRICKS-CLIENT-SECRET)
                    ACR_NAME: $(ACR-NAME)
                    AKS_NAME: $(AKS-NAME)
                - task: AzureCLI@2
                  inputs:
                    azureSubscription: ${{ parameters.serviceConnection }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      # ARM-SUBSCRIPTION-ID, ARM-TENANT-ID, and ARM-CLIENT-ID come from the variable groups.
                      test -n "$(ARM-SUBSCRIPTION-ID)" || { echo 'ARM-SUBSCRIPTION-ID is required'; exit 1; }
                      # The selected environment has its own backend state and tfvars file.
                      terraform -chdir="$(Pipeline.Workspace)/build-artifact/infra" init -backend-config="environments/${{ parameters.environmentName }}/backend.tfvars" -input=false
                                            # Which infrastructure exists is decided by the tfvars files, not the deployment
                      # profile: the profile only selects which workloads are deployed below. Driving
                      # enable_* flags from the profile would destroy resources that other profiles use.
                      terraform -chdir="$(Pipeline.Workspace)/build-artifact/infra" plan -var-file="environments/${{ parameters.environmentName }}/${{ parameters.environmentName }}.tfvars" -out=tfplan -input=false
                      # Safety gate: never delete or replace resources from the pipeline. Intentional
                      # removals are reviewed and applied by a person from a workstation.
                      deletes="$(terraform -chdir="$(Pipeline.Workspace)/build-artifact/infra" show -json tfplan | jq -r '[.resource_changes[]? | select(.change.actions | index("delete")) | .address] | .[]')"
                      if [[ -n "$deletes" ]]; then
                        echo "##vso[task.logissue type=error]Terraform plan would delete or replace these resources; apply blocked:"
                        printf '  %s\n' $deletes
                        exit 1
                      fi
                      terraform -chdir="$(Pipeline.Workspace)/build-artifact/infra" apply -auto-approve -input=false tfplan
                      if [[ "${{ not(or(eq(parameters.deploymentProfile, 'ADF_ONLY'), eq(parameters.deploymentProfile, 'MICROSERVICES_ONLY'))) }}" == "True" ]]; then
                        workspace_host="$(terraform -chdir="$(Pipeline.Workspace)/build-artifact/infra" output -raw databricks_workspace_url 2>/dev/null || true)"
                        if [[ -n "$workspace_host" && "$workspace_host" != "null" ]]; then
                          echo "##vso[task.setvariable variable=DATABRICKS-HOST]$workspace_host"
                        fi
                      fi
                  env:
                    ARM_SUBSCRIPTION_ID: $(ARM-SUBSCRIPTION-ID)
                    ARM_TENANT_ID: $(ARM-TENANT-ID)
                    ARM_CLIENT_ID: $(ARM-CLIENT-ID)
                    TF_VAR_databricks_host: $(DATABRICKS-HOST)
                    TF_VAR_databricks_account_id: $(DATABRICKS-ACCOUNT-ID)
                    TF_VAR_databricks_client_id: $(DATABRICKS-CLIENT-ID)
                    TF_VAR_databricks_client_secret: $(DATABRICKS-CLIENT-SECRET)
                  displayName: Terraform apply
                - ${{ if or(eq(parameters.deploymentProfile, 'FULL_PLATFORM'), eq(parameters.deploymentProfile, 'ADF_DATABRICKS'), eq(parameters.deploymentProfile, 'ADF_ONLY')) }}:
                  - bash: |
                      set -euo pipefail
                      ./scripts/deploy-adf.sh "${{ parameters.environmentName }}" "$(RESOURCE_GROUP_NAME)" "$(Pipeline.Workspace)/build-artifact/adf"
                    displayName: Deploy ADF ARM artifact
                    env:
                      AZURE_DEVOPS_EXT_AZURE_RM_SERVICE_PRINCIPAL_KEY: $(ARM-CLIENT-ID)
                - ${{ if eq(parameters.deploymentProfile, 'DATABRICKS_DABS') }}:
                  - bash: |
                      set -euo pipefail
                      export DATABRICKS_HOST="$(DATABRICKS-HOST)"
                      export DATABRICKS_BUNDLE_VAR_workspace_host="$(DATABRICKS-HOST)"
                      export DATABRICKS_CLIENT_ID="$(DATABRICKS-CLIENT-ID)"
                      export DATABRICKS_CLIENT_SECRET="$(DATABRICKS-CLIENT-SECRET)"
                      databricks bundle validate -t "${{ parameters.environmentName }}"
                      databricks bundle deploy -t "${{ parameters.environmentName }}"
                    workingDirectory: $(Pipeline.Workspace)/build-artifact/dabs
                    displayName: Deploy Databricks Asset Bundle
                - ${{ if or(eq(parameters.deploymentProfile, 'FULL_PLATFORM'), eq(parameters.deploymentProfile, 'ADF_DATABRICKS')) }}:
                  - bash: |
                      set -euo pipefail
                      export DATABRICKS_HOST="$(DATABRICKS-HOST)"
                      export DATABRICKS_CLIENT_ID="$(DATABRICKS-CLIENT-ID)"
                      export DATABRICKS_CLIENT_SECRET="$(DATABRICKS-CLIENT-SECRET)"
                      ./scripts/deploy-databricks.sh "${{ parameters.environmentName }}" "$(Pipeline.Workspace)/build-artifact"
                    displayName: Deploy Databricks notebooks and jobs
                - ${{ if or(eq(parameters.deploymentProfile, 'FULL_PLATFORM'), eq(parameters.deploymentProfile, 'MICROSERVICES_ONLY')) }}:
                  - bash: |
                      set -euo pipefail
                      ./scripts/deploy-microservice.sh "${{ parameters.environmentName }}" "$(RESOURCE_GROUP_NAME)" "$(ACR-NAME)" "$(AKS-NAME)" "$(Pipeline.Workspace)/build-artifact"
                    displayName: Build and deploy microservice to AKS
                - bash: |
                    set -euo pipefail
                    az resource list --resource-group "$(RESOURCE_GROUP_NAME)" --output table
                  displayName: Post-deployment validation
                - bash: ./scripts/cleanup-agent-workspace.sh
                  condition: always()
                  displayName: Clean self-hosted agent workspace
