parameters:
  - name: projectName
    type: string
  - name: deploymentProfile
    type: string

steps:
  # Build validation assembles the exact artifact used by later deployment stages.
  - task: UseNode@1
    inputs:
      # ADF tooling in this framework expects Node.js 18.
      version: 18.x
    displayName: Use Node.js 18

  - bash: |
      set -euo pipefail
      # Infrastructure is validated in pipelines/infra-pipeline.yml; this validates workload content.
      if command -v trivy >/dev/null 2>&1; then trivy fs --exit-code 1 --severity HIGH,CRITICAL --skip-dirs .git .; fi
      if [[ "${{ or(eq(parameters.deploymentProfile, 'FULL_PLATFORM'), eq(parameters.deploymentProfile, 'MICROSERVICES_ONLY')) }}" == "True" ]] && command -v docker >/dev/null 2>&1; then
        docker build --pull --file microservices/hello-web/Dockerfile --tag hello-web:ci microservices/hello-web
      fi
    displayName: Validate workload content

  - bash: |
      set -euo pipefail
      mkdir -p "$(Build.ArtifactStagingDirectory)/artifact"
      cp -R adf notebooks dabs microservices projects scripts "$(Build.ArtifactStagingDirectory)/artifact/"
      if [[ -d databricks ]]; then cp -R databricks "$(Build.ArtifactStagingDirectory)/artifact/"; fi
      printf '%s\n' "$(Build.SourceVersion)" > "$(Build.ArtifactStagingDirectory)/artifact/build-id.txt"
    displayName: Assemble immutable artifact

  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: $(Build.ArtifactStagingDirectory)/artifact
      artifact: build-artifact
    displayName: Publish build-once artifact

  - bash: ./scripts/cleanup-agent-workspace.sh
    condition: always()
    displayName: Clean self-hosted agent workspace